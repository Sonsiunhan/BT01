<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08121f" />
    <meta name="description" content="Oẳn Tù Tì v2 — đấu trực tiếp, Robot Lab và các trận chiến chiến thuật an toàn." />
    <title>Oẳn Tù Tì v2</title>
    <script>
      (() => {
        const key = "ottv2.theme";
        let saved;
        try { saved = localStorage.getItem(key); } catch { /* Use Dark when storage is unavailable. */ }
        const choice = saved === "light" || saved === "dark" || saved === "system" ? saved : "dark";
        const resolved = choice === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : choice;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
