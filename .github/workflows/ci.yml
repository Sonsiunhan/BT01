name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ottv2_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ottv2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ottv2_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate database client
        run: pnpm db:generate

      - name: Prepare CI database environment
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: B14 release gate
        run: pnpm release:gate

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Workspace package tests
        run: pnpm --filter @ottv2/server test && pnpm --filter @ottv2/web test
