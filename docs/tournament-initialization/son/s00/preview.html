    else if (p === 'rollback') { text = 'Hủy quyết định trọng tài'; body = `<p>Giữ lịch sử; tính lại kết quả/điểm/Elo bị ảnh hưởng. Không quay ngược bàn hoặc trận đã diễn ra.</p><form id="rollback-form" novalidate><label for="rollback-reason">Lý do hủy</label><textarea id="rollback-reason" required></textarea><button class="action primary">Xác nhận rollback thử</button></form>`; }
    return `<aside class="panel sidepanel" aria-labelledby="panel-title"><div class="row between"><h2 id="panel-title" tabindex="-1">${text}</h2>${action('Đóng', 'close-panel')}</div><div class="panel-body">${body}</div><div id="panel-feedback" role="status" aria-live="polite"></div></aside>`;
  }
  function canApprove() { return state.role === 'sa' && state.scheduleChecked && state.schedule === 'CLEAR' && !state.expired && !state.final && state.extension?.status === 'PENDING'; }
  function scheduleResult() { return state.schedule === 'CLEAR' ? 'CLEAR · Không có lịch xung đột trong tình huống mẫu. Duyệt thật phải kiểm lại nguyên tử.' : state.schedule === 'CONFLICT' ? 'CONFLICT · Trùng lịch bảo trì 18:00–19:00. Chưa thể duyệt.' : 'UNKNOWN · Chưa có dữ liệu capacity đáng tin cậy. Chưa thể duyệt.'; }
  function fallback() {
    if (state.view === 'loading' || state.view === 'pending') return title('QUẢN LÍ GIẢI', state.view === 'loading' ? 'Đang tải' : 'Đang gửi thao tác') + `<section class="panel" aria-busy="true"><p>${state.view === 'loading' ? 'Đang tải dữ liệu minh họa…' : 'Chờ ACK minh họa. Không gửi lại thao tác khi đang chờ.'}</p>${action('Kết thúc tình huống thử', 'recover')}</section>`;
    const map = { empty: ['Chưa có dữ liệu', 'Bạn có thể tạo bản nháp đầu tiên.'], forbidden: ['Không có quyền truy cập', 'Không hiển thị dữ liệu ngoài phạm vi.'], error: ['Không thể kết nối', 'Dữ liệu và bản nháp đang nhập vẫn được giữ.'], expired: ['Phiên đăng nhập hết hạn', 'Xác thực lại trước khi tiếp tục. Không tự gửi lại thao tác.'] };
    const [h, p] = map[state.role === 'denied' ? 'forbidden' : state.view] || map.forbidden;
    return `<div class="empty"><h1 id="s00-title" tabindex="-1">${h}</h1><p>${p}</p>${action(state.view === 'expired' ? 'Đăng nhập lại thử' : state.view === 'error' ? 'Thử lại' : 'Về trang được phép', 'recover', true)}</div>`;
  }
  function pageAllowed(page) {
    if (state.role === 'denied') return false;
    if (['ref', 'observer', 'broadcast'].includes(state.role)) return page === 'detail';
    if (page === 'draft') return state.role === 'ta';
    return ['list', 'detail', 'audit', 'offline'].includes(page);
  }
  function panelAllowed(panelId) {
    if (state.role === 'observer') return panelId.startsWith('match-');
    if (state.role === 'broadcast') return panelId.startsWith('match-') || panelId === 'broadcast';
    if (state.role === 'ref') return panelId.startsWith('match-') || panelId === 'incident';
    return true;
  }
  function render() {
    const allowed = pageAllowed(state.page);
    const ready = ['ready', 'conflict'].includes(state.view) && allowed;
    if (state.view === 'conflict' && state.page !== 'draft') state.view = 'ready';
    root.querySelector('.mainnav').hidden = ['ref', 'observer', 'broadcast', 'denied'].includes(state.role);
    root.querySelector('#actor-label').textContent = label[state.role];
    root.querySelector('#s00-role').value = state.role; root.querySelector('#s00-state').value = state.view;
    host.innerHTML = ready ? `<div class="workspace ${state.panel ? 'has-panel' : ''}"><div class="workspace-main">${({ list, draft, detail, audit, offline }[state.page])()}</div>${renderPanel()}</div>` : fallback();

    host.querySelectorAll('.mini-board').forEach(board => board.setAttribute('role', 'img'));

  function changePage(page) { const go = () => { state.page = page; state.panel = null; state.view = 'ready'; state.errors = {}; render(); focus('#s00-title'); persist(); }; if (state.page === 'draft' && state.dirty && page !== 'draft') confirmLeave(go); else go(); }
  let leaveAction = null;
  function confirmLeave(fn) { leaveAction = fn; dialog.showModal(); }

  function feedback(text, error = false) { const el = root.querySelector('#panel-feedback'); if (el) { el.textContent = text; el.setAttribute('role', error ? 'alert' : 'status'); } announce(text); }
  function updateField(el) {

    }

  }
  root.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 's00-search') { state.query = el.value; state.pageNo = 1; const filtered = tours.filter(t => (state.filter === 'all' || t.key === state.filter) && t.name.toLowerCase().includes(state.query.toLowerCase())); root.querySelector('#s00-results').innerHTML = cards(filtered, Math.ceil(filtered.length / 3)); if (globalThis.lucide) lucide.createIcons(); }

    if (el.id === 'extension-reason') state.extensionReason = el.value;
    if (el.id === 'extension-minutes') state.minutes = +el.value;
  });
  root.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 's00-role') { const role = el.value; const go = () => { state.role = role; state.panel = null; state.view = 'ready'; state.query = ''; state.errors = {}; if (['ref', 'observer', 'broadcast'].includes(role)) { state.page = 'detail'; state.selected = 'arena'; state.tab = role === 'ref' ? 'matches' : 'overview'; } else if (state.page === 'draft' && role !== 'ta') state.page = 'list'; render(); focus('#s00-title'); persist(); }; if (state.page === 'draft' && state.dirty) { el.value = state.role; confirmLeave(go); } else go(); return; }
    if (el.id === 's00-state') { state.view = el.value; if (state.view === 'conflict') { if (state.role === 'ta') state.page = 'draft'; else state.view = 'forbidden'; } state.panel = null; render(); announce('Trạng thái xem thử đã thay đổi.'); return; }

    if (el.id === 'refs') state.readyRefs = +el.value;
    if (el.id === 'finalized') state.final = el.checked;
    if (el.id === 'candidate') { state.referee = el.value; return; }
    if (el.id === 'schedule') { state.schedule = el.value; state.scheduleChecked = false; }
    if (el.id === 'expired') state.expired = el.checked;
    if (el.id === 'audit-filter') { state.auditFilter = el.value; state.auditPage = 1; }
    if (el.id === 'theme') { root.style.colorScheme = el.value === 'system' ? 'light dark' : el.value; return; }
    if (el.id === 'decision-kind') { state.decisionKind = el.value; return; }
    updateField(el);
    if (['mode', 'goal', 'goalMode', 'referee'].includes(el.name)) { render(); focus('#field-' + el.name); }
    else if (['phase', 'refs', 'finalized', 'schedule', 'expired', 'audit-filter'].includes(el.id)) { render(); focus('#' + el.id); }
  });
  root.addEventListener('click', e => {
    const fieldLink = e.target.closest('[data-field]'); if (fieldLink) { e.preventDefault(); focus('#field-' + fieldLink.dataset.field); return; }
    const b = e.target.closest('button[data-command]'); if (!b || b.disabled) return;
    const c = b.dataset.command;
    if (c.startsWith('page:')) { const target = c.slice(5); if (!pageAllowed(target)) { feedback('Vai trò này chỉ có quyền xem match-center được cấp.', true); return; } changePage(target); return; }
    if (c.startsWith('open:')) { state.selected = c.slice(5); changePage(c === 'open:draft' ? 'draft' : 'detail'); return; }
    if (c.startsWith('panel:')) { const target = c.slice(6); if (!panelAllowed(target)) { feedback('Vai trò này không có quyền mở panel quản trị này.', true); return; } panel(target); return; }
    if (c === 'broadcast-open' && state.role === 'broadcast') { state.broadcastMatch = 'CTF-001'; panel('broadcast'); return; }
    if (c.startsWith('broadcast-open:') && state.role === 'broadcast') { state.broadcastMatch = c.slice(15); panel('broadcast'); return; }
    if (c === 'broadcast-ready' && state.role === 'broadcast') { const id = state.broadcastMatch || 'CTF-001'; state.broadcastSelections[id] = { layout: root.querySelector('#broadcast-layout')?.value || 'Toàn cảnh bàn + đồng hồ', channel: root.querySelector('#broadcast-channel')?.value || 'Kênh 1' }; feedback('Đã lưu bố cục phát sóng minh họa cho ' + id + ' trong phiên này. Không kết nối kênh thật trong prototype.'); return; }

    if (c === 'leave-cancel') { dialog.close(); leaveAction = null; return; }
    if (c === 'leave-confirm') { dialog.close(); state.draft = { ...savedDraft }; state.dirty = false; leaveAction?.(); leaveAction = null; return; }
    if (c.startsWith('filter:')) { state.filter = c.slice(7); state.pageNo = 1; render(); focus(`[data-command="${c}"]`); return; }
    if (c === 'clear-filter') { state.query = ''; state.filter = 'all'; state.pageNo = 1; render(); focus('#s00-search'); return; }
    if (c === 'list-prev' || c === 'list-next') { state.pageNo += c.endsWith('next') ? 1 : -1; render(); focus('#s00-title'); return; }
    if (c === 'audit-prev' || c === 'audit-next') { state.auditPage += c.endsWith('next') ? 1 : -1; render(); focus('#s00-title'); return; }
    if (c.startsWith('tab:')) { state.page = 'detail'; state.tab = c.slice(4); state.panel = null; render(); focus('#tab-' + state.tab); return; }
    if (c === 'step-back') { state.step--; state.errors = {}; render(); focus('#step-title'); return; }
    if (c === 'save') {
      if (state.draft.name.trim().length < 3 || state.draft.name.trim().length > 120) { state.errors = { name: 'Lưu nháp cần tên từ 3 đến 120 ký tự và hợp đồng hợp lệ.' }; state.step = 0; render(); focus('#s00-errors'); return; }
      if (state.view === 'conflict') { panel('compare'); return; }
      state.saving = true; state.submitted = false; render(); setTimeout(() => { state.saving = false; state.saved = true; state.dirty = false; savedDraft = { ...state.draft }; root.dataset.savedKeys = Object.keys(normalized()).join(','); render(); focus('[data-command="save"]'); announce('Đã lưu trong phiên xem thử. Không ghi DB.'); }, 350); return;
    }
    if (c === 'compare') { panel('compare'); return; }
    if (c === 'keep-draft') { state.view = 'ready'; state.dirty = true; state.panel = null; render(); announce('Giữ bản của bạn để tiếp tục sửa. Chưa ghi đè bản server.'); return; }
    if (c === 'server-draft') { confirmLeave(() => { state.draft.name = 'Robot Arena · bản server'; state.dirty = false; state.view = 'ready'; state.panel = null; render(); }); return; }
    if (c === 'recover') { if (state.role === 'denied') { announce('Bạn vẫn chưa có quyền. Dùng bộ chọn Vai trò xem thử để chuyển tình huống; thao tác này không cấp quyền tài khoản.'); focus('#s00-role'); return; } state.view = 'ready'; if (state.role === 'ref') state.page = 'detail'; render(); focus('#s00-title'); return; }
    if (c === 'assign') {
      if (state.role !== 'ta' || state.final) return;
      if (state.referee === 'unavailable') { feedback('Không có trọng tài khả dụng. Giữ case chờ và chuyển TA theo dõi.', true); return; }

    }

    if (c === 'assignment-conflict') { feedback('Assignment revision đã đổi. Không ghi thay đổi; tải lại case để tiếp tục.', true); return; }
    if (c === 'assignment-expire') { state.assigned = null; state.incident = 'EXPIRED'; state.history.push('Lease hết hạn; quyền người cũ thu hồi.'); render(); focus('#panel-title'); return; }
    if (c === 'rollback-open' && state.role === 'ta' && !state.final) { panel('rollback'); return; }
    if (c === 'compare-schedule') { state.scheduleChecked = true; render(); focus('#panel-title'); announce(scheduleResult()); return; }
    if (c === 'reject-extension' && state.role === 'sa' && !state.expired && !state.final && state.extension?.status === 'PENDING') { const reason = root.querySelector('#approval-reason').value.trim(); if (!reason) { root.querySelector('#approval-reason').setAttribute('aria-invalid', 'true'); feedback('Cần lý do từ chối.', true); focus('#approval-reason'); return; } state.extension.status = 'REJECTED'; render(); focus('#panel-title'); return; }
    if (c.startsWith('retry-tool:')) { feedback('Đã thử kiểm tra minh họa: dependency/runtime vẫn chưa được xác minh. Không cấp READY.'); return; }
    if (c.startsWith('prepare-tool:')) { feedback('Màn chuẩn bị: xác nhận lựa chọn và kiểm tra consumer trước khi chuyển sang lối vào đã ghi. Không khởi chạy trong prototype.'); return; }
  });
  function invalidPanel(id, text) { const el = root.querySelector('#' + id); el.setAttribute('aria-invalid', 'true'); el.setAttribute('aria-describedby', 'panel-feedback'); feedback(text, true); el.focus(); }
  root.addEventListener('submit', e => {
    e.preventDefault(); const id = e.target.id;
    if (id === 's00-form') { if (state.saving || state.role !== 'ta' || !validate()) return; if (state.step < 3) { state.step++; render(); focus('#step-title'); } else { if (state.view === 'conflict') { panel('compare'); return; } state.saved = true; state.submitted = true; state.dirty = false; submittedProfile = normalized(); savedDraft = { ...state.draft }; root.dataset.submittedKeys = Object.keys(submittedProfile).join(','); render(); announce('Đã gửi hồ sơ minh họa; chưa gửi lên hệ thống.'); } }
    if (id === 'incident-form' && state.role === 'ref' && state.assigned === 'duc' && state.incident === 'IN_PROGRESS' && !state.final) {
      const reason = root.querySelector('#decision-reason').value.trim(); if (!reason) return invalidPanel('decision-reason', 'Cần lý do ra quyết định.');
      const el = root.querySelector('#decision-kind'); state.decision = { text: el.selectedOptions[0].textContent, reason, reversed: false }; state.incident = 'RESOLVED'; state.history.push(`Đức: ${state.decision.text}; lý do: ${reason}. Không cần TA duyệt.`); render(); focus('#panel-title'); announce('Đã ghi quyết định minh họa.');
    }
    if (id === 'rollback-form' && state.role === 'ta' && !state.final && state.decision && !state.decision.reversed) {
      const reason = root.querySelector('#rollback-reason').value.trim(); if (!reason) return invalidPanel('rollback-reason', 'Cần lý do rollback.');

    }
    if (id === 'tie-form' && state.role === 'ta' && !state.final) { const reason = root.querySelector('#tie-reason').value.trim(); if (!reason) return invalidPanel('tie-reason', 'Cần lý do phân xử.'); feedback('Quyết định exact-tie minh họa đã ghi; không thay đổi trận thật.'); e.target.querySelector('button').disabled = true; }

      if (!reason) return invalidPanel('extension-reason', 'Cần lý do xin gia hạn.');

    }
    if (id === 'approval-form' && canApprove()) {
      const n = +root.querySelector('#grant-minutes').value, reason = root.querySelector('#approval-reason').value.trim();

  root.addEventListener('keydown', e => {

  });

  render();
})();
