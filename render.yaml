services:
  - type: web
    name: ottv2-api
    runtime: node
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build:packages && corepack pnpm --filter @ottv2/web build && corepack pnpm --filter @ottv2/server db:deploy && corepack pnpm --filter @ottv2/server build
    startCommand: corepack pnpm --filter @ottv2/server start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://ott-v2.onrender.com
      - key: VITE_API_BASE_URL
        value: https://ott-v2.onrender.com
      - key: REALTIME_ADAPTER
        value: disabled
      - key: PLAYHTML_ENDPOINT
        sync: false
      - key: PLAYHTML_PROJECT_ID
        sync: false
